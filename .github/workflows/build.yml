name: Build Multi-Platform

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  # Delete all previous QAlity artifacts before building so storage never accumulates.
  # The GitHub API lists up to 100 artifacts per page; for typical repos this covers
  # the full history. retention-days: 1 on the upload step is a secondary safety net.
  cleanup-artifacts:
    name: Clean up old artifacts
    runs-on: ubuntu-latest
    permissions:
      actions: write   # required to list and delete artifacts via the REST API
    steps:
      - name: Delete all previous QAlity artifacts
        uses: actions/github-script@v7
        with:
          script: |
            const perPage = 100;
            let page = 1;
            let deleted = 0;

            while (true) {
              const { data } = await github.rest.actions.listArtifactsForRepo({
                owner: context.repo.owner,
                repo:  context.repo.repo,
                per_page: perPage,
                page,
              });

              const targets = data.artifacts.filter(a => a.name.startsWith("QAlity-v"));
              await Promise.all(
                targets.map(a =>
                  github.rest.actions.deleteArtifact({
                    owner:       context.repo.owner,
                    repo:        context.repo.repo,
                    artifact_id: a.id,
                  })
                )
              );
              deleted += targets.length;

              if (data.artifacts.length < perPage) break;
              page++;
            }

            core.info(`Deleted ${deleted} old artifact(s).`);

  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    needs: cleanup-artifacts
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS (ARM64 — Apple Silicon)
          - os: macos-latest
            platform: macos-aarch64
            rust-target: aarch64-apple-darwin

          # Linux
          - os: ubuntu-latest
            platform: linux
            rust-target: x86_64-unknown-linux-gnu

          # Windows
          - os: windows-latest
            platform: windows
            rust-target: x86_64-pc-windows-msvc

    steps:
      - uses: actions/checkout@v4

      - name: Read app version
        id: app_version
        shell: bash
        run: echo "version=$(jq -r '.version' src-tauri/tauri.conf.json)" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}

      - name: Clean and reinstall dependencies (Unix)
        if: runner.os != 'Windows'
        run: |
          rm -rf node_modules package-lock.json
          npm install

      - name: Clean and reinstall dependencies (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (Test-Path node_modules) { Remove-Item -Recurse -Force node_modules }
          if (Test-Path package-lock.json) { Remove-Item -Force package-lock.json }
          npm install

      - name: Build
        run: npm run build

      - name: Remove macOS quarantine attribute
        if: runner.os == 'macOS'
        run: |
          xattr -cr src-tauri/target/release/bundle/macos/QAlity.app

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: QAlity-v${{ steps.app_version.outputs.version }}-${{ matrix.platform }}
          path: src-tauri/target/release/bundle/
          retention-days: 1

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: src-tauri/target/release/bundle/**/*
          draft: true
