name: Build Multi-Platform

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS (ARM64)
          - os: macos-latest
            platform: macos-aarch64
            arch: aarch64

          # macOS (Intel x86_64)
          - os: macos-13-large
            platform: macos-x86_64
            arch: x86_64

          # Linux
          - os: ubuntu-latest
            platform: linux
            arch: x86_64

          # Windows
          - os: windows-latest
            platform: windows
            arch: x86_64

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.arch }}-unknown-linux-gnu,x86_64-pc-windows-gnu,aarch64-apple-darwin,x86_64-apple-darwin

      - name: Setup Node dependencies
        run: npm ci

      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: npm run build

      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev libappindicator3-dev librsvg2-dev patchelf
          npm run build

      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: npm run build

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: src-tauri/target/release/bundle/
          retention-days: 30

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          files: src-tauri/target/release/bundle/**/*
          draft: true
