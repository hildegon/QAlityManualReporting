[package]
name = "qality-manual-reporting"
version = "2.1.2"
description = "QAlity Manual Reporting — desktop app for Jira/Xray test management"
authors = []
edition = "2021"

[lib]
name = "qality_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Async runtime
tokio = { version = "1", features = ["full"] }
futures = "0.3"

# HTTP client
reqwest = { version = "0.12", features = ["json", "rustls-tls", "multipart"], default-features = false }

# Encryption (AES-256-GCM)
aes-gcm = "0.10"
rand = "0.8"
base64 = "0.22"

# Error handling
thiserror = "2"
anyhow = "1"

# Directories (OS-specific config paths)
dirs = "5"

[dev-dependencies]
tokio-test = "0.4"
